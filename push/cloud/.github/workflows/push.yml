name: brain-push
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay or skip runs; fine for nudges
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: brain-push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 cloud_pusher.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save state
        run: |
          git config user.name "brain-push"
          git config user.email "brain-push@users.noreply.github.com"
          git add cloud-state.json
          git diff --cached --quiet || (git commit -m "state" && git pull --rebase -q && git push -q)
